<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Fantasy Cup 2026 - 100% Convocados</title><style>body{background:#0d1b2a;color:#fff;font-family:sans-serif;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}#c,.v{background:#1e3d2f;border:3px solid #fff;border-radius:12px;padding:15px;min-height:400px;display:flex;flex-direction:column;justify-content:space-around;align-items:center}.v{background:#1b263b;border-color:#415a77;justify-content:start;gap:8px;overflow-y:auto;max-height:500px}.j{background:#415a77;padding:10px;border-radius:6px;display:flex;justify-content:space-between;width:100%;align-items:center;margin-bottom:4px}button{background:#2a9d8f;border:none;color:#fff;padding:5px 10px;border-radius:4px;cursor:pointer}.r{background:#e63946}select{background:#415a77;color:#fff;padding:8px;border-radius:6px;width:100%;margin-bottom:10px}</style></head><body>
<div id="c"><h2>Orçamento: $<span id="s">100</span>M</h2><div style="display:flex;gap:15px"><div class="p" id="ATA" onclick="f('ATA')"><h2>Escalar ATA</h2></div><div class="p" id="MEI" onclick="f('MEI')"><h2>Escalar MEI</h2></div><div class="p" id="DEF" onclick="f('DEF')"><h2>Escalar DEF</h2></div><div class="p" id="GOL" onclick="f('GOL')"><h2>Escalar GOL</h2></div></div></div>
<div class="v"><h2>Mercado: <span id="t">ATA</span></h2><select id="f" onchange="m()"><option value="ALL">Todas as 48 Seleções (Ver Completas)</option><option value="Brasil">Brasil</option><option value="França">França</option><option value="Argentina">Argentina</option><option value="Portugal">Portugal</option><option value="Inglaterra">Inglaterra</option><option value="Espanha">Espanha</option><option value="Holanda">Holanda</option><option value="Alemanha">Alemanha</option><option value="Itália">Itália</option><option value="Bélgica">Bélgica</option><option value="Croácia">Croácia</option><option value="Uruguai">Uruguai</option><option value="Colômbia">Colômbia</option><option value="Equador">Equador</option><option value="Chile">Chile</option><option value="Paraguai">Paraguai</option><option value="Venezuela">Venezuela</option><option value="México">México</option><option value="EUA">EUA</option><option value="Canadá">Canadá</option><option value="Costa Rica">Costa Rica</option><option value="Panamá">Panamá</option><option value="Jamaica">Jamaica</option><option value="Honduras">Honduras</option><option value="Marrocos">Marrocos</option><option value="Senegal">Senegal</option><option value="Nigéria">Nigéria</option><option value="Egito">Egito</option><option value="Camarões">Camarões</option><option value="Argélia">Argélia</option><option value="Gana">Gana</option><option value="Costa do Marfim">Costa do Marfim</option><option value="Tunísia">Tunísia</option><option value="Mali">Mali</option><option value="África do Sul">África do Sul</option><option value="Japão">Japão</option><option value="Coreia do Sul">Coreia do Sul</option><option value="Irã">Irã</option><option value="Arábia Saudita">Arábia Saudita</option><option value="Austrália">Austrália</option><option value="Catar">Catar</option><option value="Iraque">Iraque</option><option value="Uzbequistão">Uzbequistão</option><option value="Emirados Árabes">Emirados Árabes</option><option value="Suíça">Suíça</option><option value="Dinamarca">Dinamarca</option><option value="Áustria">Áustria</option><option value="Nova Zelândia">Nova Zelândia</option></select><div id="l" style="width:100%"></div></div>
<script src="jogadores.js"></script><script>
let st=JSON.parse(localStorage.getItem('f26'))||{b:100,e:{ATA:null,MEI:null,DEF:null,GOL:null}},sel='ATA';
function f(p){sel=p;document.getElementById('t').innerText=p;m()}
function m(){const l=document.getElementById('l'),fVal=document.getElementById('f').value;l.innerHTML='';db.filter(j=>j.p===sel&&(fVal==='ALL'||j.s===fVal)).sort((a,b)=>b.o-a.o).forEach(j=>{const inc=Object.values(st.e).some(x=>x&&x.id===j.id);l.innerHTML+=`<div class="j"><div><b>[OVR ${j.o}] ${j.n}</b> (${j.s})</div><div>$${j.c}M <button ${inc||st.b<j.c?'disabled':''} onclick="buy(${j.id})">Contratar</button></div></div>`})}
function buy(id){const j=db.find(x=>x.id===id);if(st.e[sel])rem(sel);if(st.b>=j.c){st.b-=j.c;st.e[sel]=j;up()}}
function rem(p){if(st.e[p]){st.b+=st.e[p].c;st.e[p]=null;up()}}
function up(){localStorage.setItem('f26',JSON.stringify(st));document.getElementById('s').innerText=st.b;for(let k in st.e){const v=document.getElementById(k);v.innerHTML=st.e[k]?`<h3>${st.e[k].n}</h3><small>OVR ${st.e[k].o} (${st.e[k].s})</small><br><button class="r" onclick="event.stopPropagation();rem('${k}')">Vender</button>`:`<h2>Escalar ${k}</h2>`}m()}up();
</script></body></html>
