<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Fantasy Cup 2026</title><style>body{background:#0d1b2a;color:#fff;font-family:sans-serif;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}#c,.v{background:#1e3d2f;border:3px solid #fff;border-radius:12px;padding:15px;min-height:400px;display:flex;flex-direction:column;justify-content:space-around;align-items:center}.v{background:#1b263b;border-color:#415a77;justify-content:start;gap:8px;overflow-y:auto;max-height:450px}.j{background:#415a77;padding:10px;border-radius:6px;display:flex;justify-content:space-between;width:100%;align-items:center}button{background:#2a9d8f;border:none;color:#fff;padding:5px 10px;border-radius:4px;cursor:pointer}.r{background:#e63946}</style></head><body>
<div id="c"><h2>Orçamento: $<span id="s">100</span>M</h2><div style="display:flex;gap:15px"><div class="p" id="ATA" onclick="f('ATA')"><h2>Escalar ATA</h2></div><div class="p" id="MEI" onclick="f('MEI')"><h2>Escalar MEI</h2></div><div class="p" id="DEF" onclick="f('DEF')"><h2>Escalar DEF</h2></div><div class="p" id="GOL" onclick="f('GOL')"><h2>Escalar GOL</h2></div></div></div>
<div class="v"><h2>Mercado: <span id="t">ATA</span></h2><select id="f" onchange="m()"><option value="ALL">Todas</option><option value="Brasil">Brasil</option><option value="França">França</option><option value="Argentina">Argentina</option></select><div id="l" style="width:100%"></div></div><script>
const db=[{id:1,n:"Vini Jr.",p:"ATA",s:"Brasil",o:91,c:25},{id:2,n:"Neymar",p:"ATA",s:"Brasil",o:88,c:20},{id:3,n:"Mbappé",p:"ATA",s:"França",o:92,c:26},{id:4,n:"Messi",p:"ATA",s:"Argentina",o:89,c:19},{id:5,n:"Bellingham",p:"MEI",s:"Inglaterra",o:91,c:24},{id:6,n:"Paquetá",p:"MEI",s:"Brasil",o:83,c:12},{id:7,n:"Marquinhos",p:"DEF",s:"Brasil",o:86,c:15},{id:8,n:"Saliba",p:"DEF",s:"França",o:89,c:18},{id:9,n:"Alisson",p:"GOL",s:"Brasil",o:89,c:16},{id:10,n:"Maignan",p:"GOL",s:"França",o:87,c:14}];
let st=JSON.parse(localStorage.getItem('f26'))||{b:100,e:{ATA:null,MEI:null,DEF:null,GOL:null}},sel='ATA';
function f(p){sel=p;document.getElementById('t').innerText=p;m()}
function m(){const l=document.getElementById('l'),fVal=document.getElementById('f').value;l.innerHTML='';db.filter(j=>j.p===sel&&(fVal==='ALL'||j.s===fVal)).forEach(j=>{const inc=Object.values(st.e).some(x=>x&&x.id===j.id);l.innerHTML+=`<div class="j"><div><b>[OVR ${j.o}] ${j.n}</b> (${j.s})</div><div>$${j.c}M <button ${inc||st.b<j.c?'disabled':''} onclick="buy(${j.id})">Contratar</button></div></div>`})}
function buy(id){const j=db.find(x=>x.id===id);if(st.e[sel])rem(sel);if(st.b>=j.c){st.b-=j.c;st.e[sel]=j;up()}}
function rem(p){if(st.e[p]){st.b+=st.e[p].c;st.e[p]=null;up()}}
function up(){localStorage.setItem('f26',JSON.stringify(st));document.getElementById('s').innerText=st.b;for(let k in st.e){const v=document.getElementById(k);v.innerHTML=st.e[k]?`<h3>${st.e[k].n}</h3><small>OVR ${st.e[k].o}</small><br><button class="r" onclick="event.stopPropagation();rem('${k}')">Vender</button>`:`<h2>Escalar ${k}</h2>`}m()}up();
</script></body></html>
